name: Build app packages

on:
  workflow_dispatch:
    inputs:
      with_ios:
        description: '构建 iOS 包（macOS runner 按 10 倍分钟计费；一次约 200 账单分钟，Free 额度一个月只够一次，默认关）'
        type: boolean
        default: false
      with_macos:
        description: '构建 macOS 包（同样走 macOS runner、同样 10 倍计费；默认关，需要 dmg 时再勾）'
        type: boolean
        default: false
      full_variants:
        description: 'iOS / macOS 出两个版本（短剧视界 + 全剧视界）；不勾只出全剧视界，省一半 macOS 计费分钟'
        type: boolean
        default: false
      republish:
        description: '重复发布：同一版本已有 Release / tag 时覆盖重发（取消勾选则报错停止）'
        type: boolean
        default: true

permissions:
  contents: read

# 同一个分支只留一个运行：手动重跑时会排在旧运行后面变成 pending（旧运行若正卡在等
# macOS runner，新运行连 job 都不会出现，看上去就像「不分配 runner」）。取消旧运行是安全的：
# 发布用的 prepare 会检查同名 Release/tag，republish 默认勾选即覆盖重发。
concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - &setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: dart analyze --fatal-infos lib test
        continue-on-error: true
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists_tag: ${{ steps.version.outputs.exists_tag }}
      exists_release: ${{ steps.version.outputs.exists_release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          # 仓库默认分支可能是 main 也可能是 master，两个都放行，避免手动运行时
          # 被分支名校验直接拦下（Actions 只能选仓库里真实存在的分支）。
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "只能从 main / master 分支手动发布，当前为 $GITHUB_REF。" >&2
            exit 1
          fi
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 缺少 version。" >&2
            exit 1
          fi
          tag="app-v${version//+/-}"
          exists_tag=0
          exists_release=0
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            exists_tag=1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            exists_release=1
          fi
          if [ "$exists_tag" = "1" ] || [ "$exists_release" = "1" ]; then
            if [ "$INPUT_REPUBLISH" != "true" ]; then
              echo "版本 $version（$tag）已发布过。勾选 republish 可覆盖重发，" >&2
              echo "或提升 pubspec.yaml 的 version 后再发布。" >&2
              exit 1
            fi
            echo "::warning::版本 $version（$tag）已存在（tag=$exists_tag release=$exists_release），勾选了重复发布，本次将覆盖旧 Release 与 tag 并把新包指到当前提交。"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists_tag=$exists_tag" >> "$GITHUB_OUTPUT"
          echo "exists_release=$exists_release" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy: &editions
      fail-fast: false
      matrix:
        include:
          - edition: duanjushijie
            arguments: ''
          - edition: quanjushijie
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - &setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - *setup-go
      - *setup-flutter
      # 构建机磁盘紧张（曾出现 stripReleaseDebugSymbols: No space left on device），
      # 在装 Android SDK / NDK 之前清掉用不到的预装工具链与 Docker 缓存，腾出空间。
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      # android-actions/setup-android@v3 在新 ubuntu 镜像上不稳定：
      # free-disk-space 删掉预装 SDK 后，它对 /usr/local/lib/android 的 mkdir
      # 报 EACCES，且即便重定向 ANDROID_SDK_ROOT 其行为仍不可控。
      # 改为手动把 SDK/NDK 装进一定可写的 $RUNNER_TEMP/android-sdk，可复现且不依赖第三方 action。
      - name: Set up Android SDK (manual into $RUNNER_TEMP)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${RUNNER_TEMP}/android-sdk"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          curl -fsSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q cmdtools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "ndk;28.2.13676358" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
      # 诊断：关键组件缺失时在此明确报错（打印实际缺失项），避免 build_android.py
      # 里 CGO 交叉编译阶段报成泛化的 "exit code 1"。
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          # 复现 build_native.py 的取值逻辑：优先 ANDROID_NDK_HOME，否则 sdk/ndk/28.2.13676358
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          ndk_root="${ANDROID_NDK_HOME:-${sdk}/ndk/28.2.13676358}"
          echo "ANDROID_HOME=${ANDROID_HOME}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}  ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          echo "build_native.py 将使用的 NDK = ${ndk_root}"
          ndk_bin="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for c in aarch64-linux-android24-clang armv7a-linux-androideabi24-clang x86_64-linux-android24-clang; do
            if [ ! -x "${ndk_bin}/${c}" ]; then
              echo "缺少 NDK 编译器：${ndk_bin}/${c}" >&2
              echo "---- 实际 ndk_bin 目录 ----"; ls -la "${ndk_bin}/" 2>&1 || true
              echo "---- 实际 ndk_root 目录 ----"; ls -la "${ndk_root}" 2>&1 || true
              echo "---- 实际 sdk 根目录 ----"; ls -la "${sdk}" 2>&1 || true
              exit 1
            fi
          done
          bt=$(find "${sdk}/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort | tail -n1 || true)
          if [ -z "${bt}" ]; then
            echo "未找到 build-tools（AGP 需要）" >&2; exit 1
          fi
          echo "toolchain OK: NDK $(ls "${ndk_bin}" | grep -c clang) 个 clang（${ndk_root}），build-tools=${bt##*/}"
      # Flutter 工具链是 composite build（includeBuild flutter_tools/gradle），它的
      # settings 只配了 dependencyResolutionManagement、没配 pluginManagement.repositories，
      # 于是它 buildscript 里的 kotlin jvm 2.2.20 插件（→ kotlin-stdlib:2.2.21）只在默认的
      # gradlePluginPortal 上解析——而门户不托管这个普通库 → "Could not find kotlin-stdlib:2.2.21"。
      # 之前靠暖 Gradle 缓存没暴露；free-disk-space 清缓存后必须在线解析才报错。
      # 用 init script 给「root + 每个 included build」的 pluginManagement 补 mavenCentral，
      # 不改 SDK 文件、不碰 FAIL_ON_PROJECT_REPOS（那是 dependencyResolutionManagement，另一块）。
      - name: Add Gradle init script (mavenCentral into every build's plugin classpath)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.gradle/init.d"
          printf '%s\n' \
            'beforeSettings { settings ->' \
            '    settings.pluginManagement {' \
            '        repositories {' \
            '            mavenCentral()' \
            '            gradlePluginPortal()' \
            '            google()' \
            '        }' \
            '    }' \
            '}' > "${HOME}/.gradle/init.d/flutter-repos.init.gradle"
          echo "wrote ${HOME}/.gradle/init.d/flutter-repos.init.gradle:"
          cat "${HOME}/.gradle/init.d/flutter-repos.init.gradle"
      - name: Configure Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 Secrets，本次 Android 使用 debug 签名出包（仅测试用；正式发布请在仓库 Secrets 配置 ANDROID_KEYSTORE_* 后再跑）。"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" || {
            echo "ANDROID_KEYSTORE_BASE64 不是合法 base64。" >&2
            exit 1
          }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "mode=release" >> "$GITHUB_OUTPUT"
      - run: python scripts/build_android.py ${{ matrix.arguments }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.mode == 'release'
        shell: bash
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，无法确认发布证书。" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep "$expected" >/dev/null; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    strategy: *editions
    steps:
      - uses: actions/checkout@v4
      - *setup-go
      - *setup-python
      - *setup-flutter
      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw 'MinGW-w64 安装失败，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  # 注意：macOS runner 的分钟数按 10 倍计费（Free 计划每月 2000 分钟，折合 macOS
  # 只有约 200 分钟），整条流程里 ios / macos 两个 job 用苹果机器，最容易被额度掐掉。
  # 因此：
  #   1. 用 with_ios / with_macos 两个开关分别控制要不要跑（额度紧张时手动关掉）；
  #   2. 两个版本放在同一个 job 里顺序构建——Flutter/Go 环境初始化、pub get、
  #      pod install 只付一次，第二个版本还能吃到同 job 内的 Go 构建缓存；
  #   3. continue-on-error：iOS / macOS 出包失败不再连带把 Android / Windows /
  #      网页版的发布也一起拦下来。
  ios:
    needs: prepare
    if: ${{ inputs.with_ios }}
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - *setup-flutter
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: Build unsigned iOS packages (短剧视界)
        if: ${{ inputs.full_variants }}
        run: python scripts/build_ios.py
      - name: Build unsigned iOS packages (全剧视界)
        run: python scripts/build_ios.py --all-sources
      - name: 提示 iOS 未出包
        if: failure() || cancelled()
        run: |
          echo "::warning::iOS 本次未参与构建/未完成出包，Android、Windows、网页版仍会照常发布。"
          echo "::warning::若这里是「账单额度不足」，请到 Settings → Billing 查看 Actions 用量或调高 spending limit。"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  # macOS：macos-latest 现在是 Apple 芯片机器，Go 核心脚本里两片都编
  # （arm64 + x86_64）再 lipo 成通用 dylib，Xcode 侧 Release 也默认出通用二进制，
  # 所以只出一个 dmg，Intel 机器同样能原生跑。
  macos:
    needs: prepare
    if: ${{ inputs.with_macos }}
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *setup-go
      - *setup-flutter
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          # dmgbuild 负责 dmg 里的拖拽安装布局，Pillow 画背景图；任一缺失只是
          # 退回普通 dmg，不影响出包，所以不设成硬依赖。
          python -m pip install dmgbuild Pillow
          go version
          flutter --version
          flutter precache --macos
      - name: Build macOS packages (短剧视界)
        if: ${{ inputs.full_variants }}
        run: python scripts/build_macos.py
      - name: Build macOS packages (全剧视界)
        run: python scripts/build_macos.py --all-sources
      - name: 提示 macOS 未出包
        if: failure() || cancelled()
        run: |
          echo "::warning::macOS 本次未参与构建/未完成出包，Android、Windows、网页版仍会照常发布。"
          echo "::warning::若这里是「账单额度不足」，请到 Settings → Billing 查看 Actions 用量或调高 spending limit。"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - *setup-go
      - *setup-python
      - name: Build local service edition (短剧视界 / 全剧视界)
        run: python scripts/build_web.py
      # 两个单独版本 zip 只随 guoappweb.zip 合集发布，不在 release 里单独出资产。
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web/guoappweb.zip
          if-no-files-found: error
          retention-days: 14

  # macOS 分钟最容易被账单额度掐掉，iOS / macOS job 也可能直接没有出包（见两个开关）。
  # 这里显式列出各 job 的 result 而不是单纯依赖 needs：iOS、macOS 跳过/失败只影响
  # 它自己，Android、Windows、网页版照常发布；只有这几个失败才真正拦住发布。
  release:
    needs: [checks, prepare, android, windows, ios, macos, web]
    if: >-
      ${{ !cancelled() &&
          needs.prepare.result == 'success' &&
          needs.checks.result == 'success' &&
          needs.android.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Release 令牌是否有写权限
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          headers=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO" || true)
          accepted=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-accepted-oauth-scopes"{print $2}')
          echo "该仓库 Release 接口要求的权限：$accepted"
          if printf '%s' "$accepted" | grep -qi "repo\|contents"; then :; else
            echo "::warning::拿不到 API 的权限头，无法预处理判断，等下一步实际创建时再说。"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: 发布 Release
        env:
          # 仓库默认令牌可能被仓库/组织设置压成只读；配了 RELEASE_TOKEN（有 repo 权限的
          # 个人访问令牌）时优先用它作为兜底。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXISTS_TAG: ${{ needs.prepare.outputs.exists_tag }}
          EXISTS_RELEASE: ${{ needs.prepare.outputs.exists_release }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            cert_note="签名证书 SHA-256：${ANDROID_CERT_SHA256}"
          else
            cert_note="签名证书：未配置 ANDROID_CERT_SHA256，本次 APK 为 debug 签名（仅测试用，不能覆盖升级正式版本）"
          fi
          cat > notes.md <<EOF
          版本 ${VERSION}。两个版本功能相同，区别只在站源范围，按需选择：

          - 短剧视界 duanjushijie：仅红果站源
          - 全剧视界 quanjushijie：全部站源

          Android：
          - *-arm64-v8a.apk：适用于较新的安卓设备
          - *-armeabi-v7a.apk：适用于较老的安卓设备，电视推荐使用此版本
          - *-x86_64.apk：适用于模拟器

          iOS：
          - *-ios-unsigned.ipa：未签名 IPA，可用相关工具安装

          macOS：
          - *-macos-universal.dmg：通用包，Apple 芯片与 Intel 机器都原生运行；打开后把应用拖进 Applications
          - 包为 ad-hoc 签名（未公证），首次打开请在「系统设置 → 隐私与安全性」点「仍要打开」，或执行
            xattr -dr com.apple.quarantine /Applications/短剧视界.app

          Windows：
          - *-windows-x64.zip：解压后运行 duanjushijie.exe 或 quanjushijie.exe

          本地服务版（web/guoappweb.zip）：
          - guoappweb.zip：短剧视界 / 全剧视界 两个版本的合集（解压后得到 duanjushijie.zip / quanjushijie.zip，含 SHA256SUMS.txt）
          - 两个版本 zip 内均已内置 Windows 版 ffmpeg.exe，解压后双击 start.bat（Windows）或执行 sh start.sh（macOS/Linux），浏览器打开 http://127.0.0.1:8000/web/

          ${cert_note}
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          printf '%s' "$changes" > changes.md
          if [ -n "$changes" ]; then
            { printf '更新内容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi
          ipa_count=$(find release -maxdepth 1 -name '*.ipa' | wc -l)
          if [ "$ipa_count" -eq 0 ]; then
            echo "::warning::本次发布未包含 iOS 包（未勾选 with_ios 或 iOS job 未成功）。"
            printf '\n注意：本次发布未包含 iOS 包，原因见 Actions 运行详情里的 ios job。\n' >> notes.md
          fi
          # 减量构建：iOS 只有勾了 full_variants 才出短剧视界。说明里必须写清楚，
          # 否则拿到包的人会以为短剧视界 IPA 是漏发了。
          duanju_ipa=$(find release -maxdepth 1 -name 'duanjushijie-*.ipa' | wc -l)
          if [ "$ipa_count" -gt 0 ] && [ "$duanju_ipa" -eq 0 ]; then
            echo "::warning::本次 iOS 只出了全剧视界（full_variants 未勾选）。"
            printf '\n注意：本次 iOS 只出了全剧视界（为节省 macOS 计费分钟），短剧视界 IPA 需另行构建。\n' >> notes.md
          fi
          dmg_count=$(find release -maxdepth 1 -name '*.dmg' | wc -l)
          if [ "$dmg_count" -eq 0 ]; then
            echo "::warning::本次发布未包含 macOS 包（未勾选 with_macos 或 macOS job 未成功）。"
            printf '\n注意：本次发布未包含 macOS 包，原因见 Actions 运行详情里的 macos job。\n' >> notes.md
          fi
          duanju_dmg=$(find release -maxdepth 1 -name 'duanjushijie-*.dmg' | wc -l)
          if [ "$dmg_count" -gt 0 ] && [ "$duanju_dmg" -eq 0 ]; then
            echo "::warning::本次 macOS 只出了全剧视界（full_variants 未勾选）。"
            printf '\n注意：本次 macOS 只出了全剧视界（为节省 macOS 计费分钟），短剧视界 dmg 需另行构建。\n' >> notes.md
          fi
          if [ "$EXISTS_RELEASE" = "1" ] || [ "$EXISTS_TAG" = "1" ]; then
            printf '\n本次为重复发布：已用同名包覆盖此前的 %s 旧资产。\n' "$TAG" >> notes.md
          fi
          # 重复发布：先把同名 Release 和 tag 清掉，再按当前提交重建，否则 gh release
          # create 会因为 tag 已存在而失败。顺序很重要——先删 Release（它靠 tag 定位），
          # 再删 tag ref；任何一步失败都退到下面的「更新现有 Release」兜底。
          if [ "$EXISTS_RELEASE" = "1" ]; then
            echo "删除已存在的 Release $TAG …"
            gh release delete "$TAG" --yes --cleanup-artifacts || true
          fi
          if [ "$EXISTS_TAG" = "1" ]; then
            echo "删除已存在的远端 tag $TAG …"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          fi
          # 这里常见的失败是 HTTP 403 Resource not accessible by integration：
          # 仓库/组织设置把 GITHUB_TOKEN 的默认权限压成了只读（job 里写的
          # contents: write 未必能覆盖仓库级默认值）。给一句人能看懂的处理办法，
          # 免得每次都来对 POST /releases 干瞪眼。
          publishing_failed() {
            echo "::error::发布 Release 失败。若提示 Resource not accessible by integration，"
            echo "::error::请把 Settings → Actions → General → Workflow permissions 改成"
            echo "::error::「Read and write permissions」，或在仓库 Secrets 配 RELEASE_TOKEN"
            echo "::error::（带 repo 权限的个人访问令牌）；改完后必须重新触发一次新的运行，"
            echo "::error::点 Re-run 重跑不生效——重跑会沿用原运行当时的令牌权限。"
            exit 1
          }
          if gh release create "$TAG" release/* --target "$GITHUB_SHA" \
                --title "短剧视界 / 全剧视界 ${VERSION}" --notes-file notes.md; then
            exit 0
          fi
          # tag 没删干净（比如令牌没有删 ref 的权限）时落到这条兜底：
          # 沿用已有 Release，覆盖同名资产并更新说明。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::无法重建 Release，改为更新现有 Release 的资产与说明。"
            gh release upload "$TAG" release/* --clobber || publishing_failed
            gh release edit "$TAG" --title "短剧视界 / 全剧视界 ${VERSION}" \
              --notes-file notes.md || publishing_failed
            exit 0
          fi
          publishing_failed
      - name: 推送到 Telegram 频道
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "未配置 Telegram，跳过推送。"
            exit 0
          fi
          changes="$(cat changes.md)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          text="短剧视界 / 全剧视界 ${VERSION} 已发布"
          if [ -n "$changes" ]; then
            text="$(printf '%s\n\n更新内容：\n\n%s' "$text" "${changes:0:3500}")"
          fi
          text="$(printf '%s\n\n下载：%s' "$text" "$url")"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null
