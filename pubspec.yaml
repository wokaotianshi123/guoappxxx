name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 0.3.1+90

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  nsd: 5.0.1
  package_info_plus: ^10.2.1
  lucide_icons_flutter: 3.1.20
  wakelock_plus: ^1.8.0
  pinyin: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  # Windows 上 media_kit_video 2.0.1 的 VideoOutput 存在并发缺陷（Render/CheckAndResize
  # 与 Resize 竞争 + thread_pool 任务里抛 std::out_of_range → std::terminate →
  # 0xc0000409 闪退），上游未修，这里用打过补丁的本地副本替换。
  media_kit_video:
    path: packages/media_kit_video

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/video_enhancement/
    # 番茄内容引擎的配置与过滤词表，由 FanqieBackend 在启动时写到运行目录。
    - assets/fanqie/
